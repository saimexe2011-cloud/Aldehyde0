<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>

  <style>
    :root {
      --bg: #0f0f13;
      --panel: #171717;
      --panel-2: #222222;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #9ca3af;
      --blue: #2d7ff9;
      --green: #22c55e;
      --orange: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      height: 100vh;
      max-width: 950px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.01);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    .title h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .status.online {
      color: var(--green);
    }

    .status.offline {
      color: var(--orange);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
    }

    .search-toggle input {
      cursor: pointer;
    }

    .small-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .small-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      font-size: 15px;
    }

    .message-row.user .bubble {
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .bubble {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 160px;
      resize: none;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(45, 127, 249, 0.7);
    }

    button.send-btn {
      padding: 0 18px;
      border: none;
      border-radius: 14px;
      background: var(--blue);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 70px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .footer-note {
      padding: 0 16px 12px 16px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
    }

    @media (max-width: 650px) {
      .bubble {
        max-width: 92%;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>My AI Chatbot</h1>
        <div id="status" class="status">Checking backend...</div>
      </div>

      <div class="header-actions">
        <label class="search-toggle" title="If enabled, the backend may use web search.">
          <input type="checkbox" id="searchToggle" checked />
          Web Search
        </label>

        <button id="clearBtn" class="small-btn">Clear Chat</button>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <div class="input-area">
      <textarea
        id="input"
        placeholder="Message the chatbot... Use /search latest AI news"
      ></textarea>

      <button id="sendBtn" class="send-btn">Send</button>
    </div>

    <div class="footer-note">
      Tip: Use <b>/search your query</b> to force internet search.
      Change <b>BACKEND_BASE</b> in the JavaScript code if your Python backend is hosted online.
    </div>
  </div>

  <script>
    /*
      ============================================
      CONFIGURATION
      ============================================

      If you are running the Python backend locally:
        python offline_chatbot.py serve --host 0.0.0.0 --port 8000

      Keep this as:
        http://127.0.0.1:8000

      If you deploy the backend online, replace it with:
        https://your-backend-url.com

      You can also open the page like this:
        index.html?backend=https://your-backend-url.com
    */

    const params = new URLSearchParams(window.location.search);
    const BACKEND_BASE = params.get("backend") || "http://127.0.0.1:8000";
    const CHAT_ENDPOINT = BACKEND_BASE + "/chat";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const status = document.getElementById("status");
    const searchToggle = document.getElementById("searchToggle");

    let backendOnline = false;
    let typingRow = null;

    const WELCOME_MESSAGE = `Hello! I am your chatbot.

If your Python backend is running, I can give AI replies and use web search.
If the backend is not running, I will respond in demo mode.

Use:
/search latest AI news

to force web search.`;

    function escapeText(text) {
      return String(text ?? "");
    }

    function addMessage(text, sender) {
      const row = document.createElement("div");
      row.className = `message-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = escapeText(text);

      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      hideTyping();

      typingRow = document.createElement("div");
      typingRow.className = "message-row bot typing";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      `;

      typingRow.appendChild(bubble);
      chat.appendChild(typingRow);

      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      if (typingRow) {
        typingRow.remove();
        typingRow = null;
      }
    }

    function clearChat() {
      chat.innerHTML = "";
      addMessage(WELCOME_MESSAGE, "bot");
    }

    async function checkBackend() {
      status.textContent = "Checking backend...";
      status.className = "status";

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(BACKEND_BASE + "/", {
          method: "GET",
          signal: controller.signal
        });

        clearTimeout(timeout);

        if (response.ok) {
          backendOnline = true;
          status.textContent = "Backend connected";
          status.className = "status online";
        } else {
          throw new Error("Backend returned error");
        }
      } catch (error) {
        backendOnline = false;
        status.textContent = "Demo mode - Python backend not connected";
        status.className = "status offline";
      }
    }

    function localFallback(message, error) {
      const m = message.toLowerCase();

      let prefix = "";

      if (error && error.message && error.message !== "offline") {
        prefix = `Backend error: ${error.message}\n\n`;
      }

      if (m.startsWith("/search")) {
        return (
          prefix +
          `Web search requires the Python backend.

Run this in your project folder:

python offline_chatbot.py serve --host 0.0.0.0 --port 8000

Then refresh this page.`
        );
      }

      if (m.includes("hello") || m.includes("hi") || m.includes("hey")) {
        return (
          prefix +
          "Hello! I am currently in frontend demo mode. Connect the Python backend for real AI replies."
        );
      }

      if (m.includes("who are you")) {
        return (
          prefix +
          "I am a ChatGPT-style HTML frontend. My real brain is the Python backend."
        );
      }

      if (m.includes("search")) {
        return (
          prefix +
          "To search the internet, run the Python backend and type:\n/search your query"
        );
      }

      return (
        prefix +
        `Demo mode reply:

"${message}"

I am only an HTML frontend. Please start the Python backend to get real AI replies and internet search.`
      );
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      showTyping();

      const forceSearch = message.toLowerCase().startsWith("/search");

      try {
        if (!backendOnline) {
          throw new Error("offline");
        }

        const response = await fetch(CHAT_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message,
            search: searchToggle.checked,
            force_search: forceSearch
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Backend error");
        }

        hideTyping();

        addMessage(data.reply || "No reply from backend.", "bot");
      } catch (error) {
        hideTyping();

        const fallback = localFallback(message, error);
        addMessage(fallback, "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });

    clearBtn.addEventListener("click", function () {
      clearChat();
    });

    // Initialize
    clearChat();
    checkBackend();
  </script>
</body>
</html>
